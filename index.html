<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CubeTex · Material Studio</title><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="graph.css"></head><body>
<header><div class="brand"><svg viewBox="0 0 36 36" aria-hidden="true"><path fill="#6ff3d1" d="M18 1 34 10v16l-16 9L2 26V10zm0 5L8 12l10 6 10-6zm-12 10v8l10 6v-8zm24 0-10 6v8l10-6z"/></svg>CubeTex</div><span class="division"></span><span class="wordmark">MATERIAL STUDIO</span><div class="spacer"></div><button id="new">Novo</button><button id="open">▱ &nbsp; Abrir</button><button id="save">Salvar projeto</button><button id="export" class="primary">⇩ &nbsp; Exportar mapa</button><input hidden id="file" type="file" accept=".cubetex,.json"></header>
<main><div class="project"><div><div class="eyebrow">WORKSPACE &nbsp; / &nbsp; MATERIAIS</div><h1><input id="projectName" value="Cobre oxidado" aria-label="Nome do material" maxlength="80"></h1></div><div class="project-meta"><span class="live"></span><span id="status" role="status">Pronto</span><span class="division"></span><label for="resolution">Resolução</label><select id="resolution"><option value="512">512 px</option><option value="1024">1K</option><option value="2048" selected>2K</option><option value="4096">4K</option></select></div></div>
<section class="layout"><div class="workspace"><section class="panel preview"><div class="bar"><h2><i>◈</i> Visualizador</h2><div class="switch"><button class="active" id="view3">3D</button><button id="view2">2D</button></div></div><div class="previewbody"><div class="stage" id="stage"><div class="floor"></div><span class="stamp" id="stamp">PERSPECTIVA</span><canvas id="sphere" width="400" height="400" aria-label="Material aplicado em uma esfera"></canvas><div class="axis" aria-hidden="true"><b>Z</b><em>Y</em><small>X</small></div><span class="stagehint" id="stagehint">Arraste para girar</span></div><div class="maps"><h3>MAPAS DE SAÍDA</h3><div id="maplist"></div></div></div></section>
<section class="panel graphpanel"><div class="bar"><h2><i>⌘</i> Editor de nós</h2><div class="actions"><button class="small" id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">↶</button><button class="small" id="redo" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer">↷</button><button class="small" id="add">＋ Adicionar nó</button></div></div><div id="graph" tabindex="0" aria-label="Grafo do material"></div></section></div>
<aside class="panel"><div class="bar"><h2><i>☷</i> Propriedades</h2></div><div class="tabs"><button id="paramsTab" class="chosen">Parâmetros</button><button id="lightTab">Iluminação</button></div><div id="inspector"></div><div id="sample" class="sample"><h3>PRÉVIA DO NÓ</h3><canvas width="180" height="100" id="nodeSample"></canvas></div><div id="lighting" hidden><h3>LUZ DIRECIONAL</h3><div id="sliders"></div><button id="bake" class="primary">Gerar bake de luz</button></div></aside></section></main>
<footer><span><b>◇</b> CubeTex Engine</span><span id="count"></span><span class="footright">Pipeline procedural &nbsp; · &nbsp; RGB</span></footer>
<dialog id="modal"><form method="dialog"><div class="bar"><h2>Exportar textura</h2><button value="cancel" aria-label="Fechar">×</button></div></form><div class="dialogbody"><label>Mapa<select id="mapSelect"></select></label><label>Resolução<select id="exportRes"></select></label><p>PNG · 8 bits por canal</p><button class="primary" id="download">Baixar PNG</button></div></dialog>
<script src="engine.js"></script><script src="graph.js"></script><script src="studio.js"></script></body></html>
